plugins {
  id 'java'
  id 'application'
  id 'checkstyle'
  id 'io.freefair.lombok' version '8.14'
  id 'com.limark.gitflowsemver' version '0.3.1'
  id 'com.diffplug.spotless' version '7.0.4'
  id 'com.google.cloud.tools.jib' version '2.4.0'
}

group = 'com.github.rishabh9'

repositories {
  mavenCentral()
}

ext {
  vertxVersion = '3.9.1'
  junitJupiterEngineVersion = '5.13.0'
  junitPlatformLauncherVersion = '1.11.4'
  log4j2Version = '2.23.0'
  disruptorVersion = '4.0.0'
  tikaVersion = '3.2.0'
  aaltoVersion = '1.3.3'
}

application {
  mainClassName = 'io.vertx.core.Launcher'
  applicationDefaultJvmArgs = [
      '-Dlog4j2.contextSelector=org.apache.logging.log4j.core.async.AsyncLoggerContextSelector',
      '-Dvertx.logger-delegate-factory-class-name=io.vertx.core.logging.Log4j2LogDelegateFactory'
  ]
}

java {
  withJavadocJar()
  withSourcesJar()

  sourceCompatibility = JavaVersion.VERSION_23
  targetCompatibility = JavaVersion.VERSION_23
}

def mainVerticleName = 'com.github.rishabh9.kumoru.MainVerticle'
def watchForChange = 'src/**/*'
def doOnChange = './gradlew classes'

dependencies {
  implementation "io.vertx:vertx-web:$vertxVersion"
  implementation "io.vertx:vertx-web-client:$vertxVersion"

  implementation "org.apache.tika:tika-core:$tikaVersion"
  implementation "com.fasterxml:aalto-xml:$aaltoVersion"

  implementation "org.apache.logging.log4j:log4j-api:$log4j2Version"
  implementation "org.apache.logging.log4j:log4j-core:$log4j2Version"
  implementation "com.lmax:disruptor:$disruptorVersion"

  testImplementation "io.vertx:vertx-junit5:$vertxVersion"
  testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junitJupiterEngineVersion"
  testImplementation "org.junit.jupiter:junit-jupiter-api:$junitJupiterEngineVersion"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher:$junitPlatformLauncherVersion"
}

test {
  useJUnitPlatform()
  testLogging {
    events 'PASSED', 'FAILED', 'SKIPPED'
  }
}

run {
  args = [
      'run', mainVerticleName,
      "--redeploy=$watchForChange",
      "--launcher-class=$mainClassName",
      "--on-redeploy=$doOnChange"
  ]
  jvmArgs = [
      '-Dlog4j2.contextSelector=org.apache.logging.log4j.core.async.AsyncLoggerContextSelector',
      '-Dvertx.logger-delegate-factory-class-name=io.vertx.core.logging.Log4j2LogDelegateFactory'
  ]
}

jib {
  from {
    image = 'azul/zulu-openjdk-alpine:23-jre'
  }
  to {
    image = 'rishabh9/kumoru'
    credHelper = 'docker-credential-osxkeychain'
    project.afterEvaluate {
      tags = [version] as Set<String>
    }
  }
  container {
    jvmFlags = [
        '-Dlog4j2.contextSelector=org.apache.logging.log4j.core.async.AsyncLoggerContextSelector',
        '-Dvertx.logger-delegate-factory-class-name=io.vertx.core.logging.Log4j2LogDelegateFactory'
    ]
    format = 'OCI'
    mainClass = mainClassName
    args = ['run', mainVerticleName]
    project.afterEvaluate {
      environment = [KUMORU_VERSION: version] as Map<String, String>
    }
  }
}

spotless {
  java {
    googleJavaFormat('1.22.0')
  }
}
